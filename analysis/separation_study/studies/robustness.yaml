# Robustness study: empfohlene Konfiguration gegen S0/S1/S2/S3 testen.
#
# Ziel: zeigen wie der mid-band-empfohlene Punkt (elevation_step=3) auf
# Quell-Variation reagiert.
#
# 3 DOA-Methoden × 4 Szenarien × (1 baseline + 1 override) = 24 Runs
# Jede Methode mit ihrer eigenen Pipeline-Config.

phase: robustness
output_root: results/separation_study/robustness
scenarios: [S0, S1, S2, S3]
configs:
  - configs/pipeline_mixed_doa_rotor_cone.yaml
  - configs/pipeline_mixed_doa_drone_disk.yaml
  - configs/pipeline_mixed_doa_target_cone.yaml
axes:
  # Empfohlene Anpassung: elevation_step von 5 auf 3
  array_filter.doa_grid.elevation_step_deg: [3.0]
