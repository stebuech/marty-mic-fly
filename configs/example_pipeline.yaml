input:
  audio_h5: /media/steffen/Data/Arbeit/MartyMicFly/Messdaten/synth_data/ap2a_synth_mixed_gaptip.h5
  mic_geom_xml: /media/steffen/Data/Arbeit/MartyMicFly/Messdaten/synth_data/mic_geom.xml
  ground_truth_h5: /media/steffen/Data/Arbeit/MartyMicFly/Messdaten/synth_data/ap2a_synth_mixed_gaptip_gt.h5

segment:
  mode: middle
  duration: 10.0

channels:
  selection: all

rotor:
  n_blades: 2
  n_harmonics: 13

stages:
  - kind: notch
    pole_radius:
      mode: scalar
      value: 0.9996
    multichannel: false
    block_size: 4096

  - kind: array_filter
    algorithm: clean_sc
    csm:
      nperseg: 512
      noverlap: 256
      window: hann
      diag_loading_rel: 1.0e-6
      f_min_hz: 200.0
      f_max_hz: 6000.0
    diagnostic_grid:
      extent_xy_m: 0.5
      increment_m: 0.05
      # 3D grid spans rotor plane (z≈0) and the external source at z=-1.5,
      # so a single CLEAN-SC pass localizes both. z_min/z_max == None falls back
      # to a single z-slice at platform.rotor_positions[2,0].
      z_min_m: -1.6
      z_max_m: 0.1
    bands:
      - { name: low,  f_min_hz: 200.0,  f_max_hz: 500.0 }
      - { name: mid,  f_min_hz: 500.0,  f_max_hz: 2000.0 }
      - { name: high, f_min_hz: 2000.0, f_max_hz: 6000.0 }
    target_point_m: [0.0, 0.0, -1.5]
    # mask_mode controls which cells are subtracted from the observed CSM.
    #   target_box (default): subtract everything OUTSIDE a small box around
    #     target_point_m — robust against CLEAN-SC mislocalization.
    #   rotor_disc: subtract cells inside the rotor discs ± rotor_z_tolerance_m
    #     — direct interpretation, useful as a diagnostic when CLEAN-SC actually
    #     resolves the rotors (mid/high bands).
    mask_mode: target_box
    # half-extent must be wide enough to capture CLEAN-SC's z-aliases of the
    # external source (the gap_tip ring array can't resolve a source at z=-1.5
    # cleanly — it scatters energy along z, with peaks near z=-1.6 and z=-1.1).
    # ±0.6 m in z covers both aliases; ±0.3 m in xy captures lateral spread.
    # Drone (z≈0) stays outside the box and is fully subtracted.
    target_box_half_extent_m: [0.3, 0.3, 0.6]
    # Only used when mask_mode = rotor_disc:
    rotor_z_tolerance_m: 0.25
    clean_sc:
      damp: 0.6
      n_iter: 100
      # r_diag=True removes the CSM diagonal (uncorrelated mic self-noise) before
      # beamforming; suppresses the centerline beam at xy=(0,0).
      r_diag: true

metrics:
  welch_nperseg: 8192
  welch_noverlap: 4096
  bandwidth_factor: 1.0
  broadband_low_hz: null

plots:
  enabled: true
  fmax_hz: null
  spectrogram_window: 4096
  spectrogram_overlap: 2048
  channel_subset: null

output:
  dir: results/pipeline/{run_id}
  filtered_h5: filtered.h5
  metrics_json: metrics.json
  plots_subdir: plots
  copy_config: true
