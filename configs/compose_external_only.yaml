input:
  drone_source_artifact_h5: /media/steffen/Data/Arbeit/MartyMicFly/Messdaten/synth_data/drone_source_artifact_gaptip.h5
  mic_geom_xml: /media/steffen/Data/Arbeit/MartyMicFly/Messdaten/synth_data/mic_geom.xml

# include_drone=false: synth file contains ONLY the propagated external source
# (no drone signal). Used as a methodology reference: any energy that Stage 2
# subtracts here is a false positive at the external source.
include_drone: false

external:
  kind: noise
  position_m: [0.0, 0.0, -1.5]
  amplitude_db: 0.0
  duration_s: null
  seed: 0

output:
  synth_h5: /media/steffen/Data/Arbeit/MartyMicFly/Messdaten/synth_data/ap2a_synth_external_only_gaptip.h5
  ground_truth_h5: /media/steffen/Data/Arbeit/MartyMicFly/Messdaten/synth_data/ap2a_synth_external_only_gaptip_gt.h5
